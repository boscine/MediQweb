<figure class="chart">
  @if (caption(); as title) {
    <figcaption class="chart__caption">{{ title }}</figcaption>
  }

  @if (hasData()) {
    <!--
      The canvas is hidden from assistive technology on purpose: the list below
      states every point as text, and a screen reader hearing both would read the
      same numbers twice.
    -->
    <div class="chart__plot" [style.height.px]="plotHeight">
      <canvas #canvas aria-hidden="true"></canvas>
    </div>

    <ul class="visually-hidden">
      @for (point of points(); track point.label) {
        <li>{{ point.label }}: {{ describe(point.value) }}</li>
      }
    </ul>
  } @else {
    <p class="chart__empty">{{ emptyMessage() }}</p>
  }
</figure>
